<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- iOS PWA 关键配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WhiteNoise Pro">
    
    <!-- 防止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <title>WhiteNoise Pro - 白噪音专注助手</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA 图标 -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
    
    <!-- SEO 描述 -->
    <meta name="description" content="WhiteNoise Pro 是一款专业的白噪音应用，提供雨声、雷声、海浪等 7 种自然音效，帮助您专注工作、放松身心、改善睡眠。">
    <meta name="keywords" content="白噪音，专注，冥想，睡眠，放松，雨声，海浪，自然音效">
</head>
<body>
    <div class="container">
        <!-- 标签页导航 -->
        <div class="tab-nav">
            <button class="tab-button active" data-tab="sounds">🎵 声音</button>
            <button class="tab-button" data-tab="focus">⏱️ 专注</button>
            <button class="tab-button" data-tab="breathing">🧘 呼吸</button>
        </div>

        <!-- 白噪音内容 -->
        <div class="tab-content active" id="sounds-tab">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">🎧 白噪音</h1>
            
            <!-- 播放控制 -->
            <div class="playback-controls">
                <button class="control-btn play-btn" id="play-btn" aria-label="播放">▶</button>
                <button class="control-btn stop-btn" id="stop-btn" aria-label="停止">⏹</button>
            </div>
            
            <!-- 音效选择 -->
            <div class="sound-grid" id="sound-grid">
                <!-- 音效卡片将通过 JavaScript 动态生成 -->
            </div>
            
            <!-- 使用提示 -->
            <div class="usage-tip">
                <p>💡 点击音效卡片开始播放，支持多音效组合</p>
                <p>🌧️ 推荐组合：雨声 + 雷声 = 完美雷雨夜</p>
            </div>
        </div>

        <!-- 专注模式内容 -->
        <div class="tab-content" id="focus-tab">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">⏱️ 专注模式</h1>
            
            <div class="focus-display">
                <div class="focus-time" id="focus-time">25:00</div>
                <div class="focus-mode work-mode" id="focus-mode">工作时间</div>
            </div>
            
            <div class="duration-selector">
                <div class="duration-options">
                    <button class="duration-btn active" data-duration="25">25 分钟</button>
                    <button class="duration-btn" data-duration="30">30 分钟</button>
                    <button class="duration-btn" data-duration="45">45 分钟</button>
                    <button class="duration-btn" data-duration="60">60 分钟</button>
                </div>
            </div>
            
            <div class="focus-controls">
                <button class="control-btn play-btn" id="focus-play">▶</button>
            </div>
            
            <div class="focus-info">
                <p>🍅 番茄工作法：25 分钟专注 + 5 分钟休息</p>
                <p>🎯 自动播放雨声帮助您保持专注</p>
            </div>
        </div>

        <!-- 呼吸练习内容 -->
        <div class="tab-content" id="breathing-tab">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">🧘 呼吸练习</h1>
            
            <div class="breathing-container">
                <div class="breathing-visual" id="breathing-visual">
                    <div class="breathing-circle"></div>
                </div>
                
                <div class="breathing-info">
                    <div class="breathing-phase" id="breathing-phase">准备</div>
                    <div class="breathing-instruction" id="breathing-instruction">点击开始按钮开始 4-7-8 呼吸法</div>
                </div>
                
                <div class="breathing-controls">
                    <button class="control-btn play-btn" id="breathing-play">▶</button>
                </div>
                
                <div class="breathing-method">
                    <h3>4-7-8 呼吸法</h3>
                    <ul>
                        <li><strong>吸气 4 秒</strong> - 用鼻子深深吸气</li>
                        <li><strong>屏息 7 秒</strong> - 保持呼吸</li>
                        <li><strong>呼气 8 秒</strong> - 用嘴缓缓呼气</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 音频生成器 -->
    <script src="procedural-audio.js"></script>
    <!-- 主应用程序 -->
    <script src="app.js"></script>
    <!-- 计时器逻辑 -->
    <script src="timer.js"></script>
</body>
</html>
